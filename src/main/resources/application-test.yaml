server:
  port: 0

spring:
  data:
    redis:
      host: ${CACHE_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${CACHE_PASSWORD:}
      timeout: 1000ms

  datasource:
    hikari:
      maximum-pool-size: 5

  jpa:
    properties:
      hibernate:
        show_sql: true
        format_sql: true

  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 2000
            readTimeout: 2000

feign:
  client:
    api:
      url: ${API_URL:http://localhost:8081}
      key: test-key

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 1000ms
        ignoreExceptions:
          - by.ares.transaction_validation_service.exception.ApiException
  retry:
    configs:
      default:
        maxAttempts: 2
        waitDuration: 100ms
        retryExceptions:
          - by.ares.transaction_validation_service.exception.ApiTimeoutException
  bulkhead:
    configs:
      default:
        maxConcurrentCalls: 10