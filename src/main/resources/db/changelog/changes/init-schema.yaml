databaseChangeLog:
  - changeSet:
      id: 001-create-expense-limits-table
      author: ares
      changes:
        - createTable:
            tableName: expense_limits
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: account_number
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
              - column:
                  name: expense_category
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: limit_sum
                  type: NUMERIC(15, 2)
                  constraints:
                    nullable: false
              - column:
                  name: limit_currency_shortname
                  type: VARCHAR(3)
                  defaultValue: "USD"
                  constraints:
                    nullable: false
              - column:
                  name: limit_datetime
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - sql:
            sql: "ALTER TABLE expense_limits ADD CONSTRAINT chk_limit_category CHECK (expense_category IN ('product', 'service'));"
        - createIndex:
            indexName: idx_limits_acc_cat_dt
            tableName: expense_limits
            columns:
              - column:
                  name: account_number
              - column:
                  name: expense_category
              - column:
                  name: limit_datetime
                  descending: true

  - changeSet:
      id: 002-create-currency-rates-table
      author: ares
      changes:
        - createTable:
            tableName: currency_rates
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: currency_pair
                  type: VARCHAR(7)
                  constraints:
                    nullable: false
              - column:
                  name: rate_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: close_rate
                  type: NUMERIC(18, 6)
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: currency_rates
            columnNames: currency_pair, rate_date
            constraintName: uq_pair_date
        - createIndex:
            indexName: idx_rates_pair_date
            tableName: currency_rates
            columns:
              - column:
                  name: currency_pair
              - column:
                  name: rate_date
                  descending: true

  - changeSet:
      id: 003-create-transactions-table
      author: ares
      changes:
        - createTable:
            tableName: transactions
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: account_from
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
              - column:
                  name: account_to
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
              - column:
                  name: currency_shortname
                  type: VARCHAR(3)
                  constraints:
                    nullable: false
              - column:
                  name: sum
                  type: NUMERIC(15, 2)
                  constraints:
                    nullable: false
              - column:
                  name: expense_category
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: datetime
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: sum_usd
                  type: NUMERIC(15, 2)
                  constraints:
                    nullable: false
              - column:
                  name: limit_exceeded
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: applied_limit_id
                  type: BIGINT
                  constraints:
                    foreignKeyName: fk_tx_applied_limit
                    referencedTableName: expense_limits
                    referencedColumnNames: id
                    nullable: true
        - sql:
            sql: "ALTER TABLE transactions ADD CONSTRAINT chk_trans_category CHECK (expense_category IN ('product', 'service'));"
        - createIndex:
            indexName: idx_trans_acc_cat_dt
            tableName: transactions
            columns:
              - column:
                  name: account_from
              - column:
                  name: expense_category
              - column:
                  name: datetime

  - changeSet:
      id: 004-create-limit-locks-table
      author: ares
      changes:
        - createTable:
            tableName: limit_locks
            columns:
              - column:
                  name: account_number
                  type: VARCHAR(10)
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_limit_locks
                    nullable: false
              - column:
                  name: expense_category
                  type: VARCHAR(16)
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_limit_locks
                    nullable: false