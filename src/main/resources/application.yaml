spring:
  application:
    name: TransactionValidationService

  threads:
    virtual:
      enabled: true

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
        group:
          enabled: true

resilience4j:
  circuitbreaker:
    instances:
      currency-read-client:
        baseConfig: default
  retry:
    instances:
      currency-read-client:
        baseConfig: default
  bulkhead:
    instances:
      currency-read-client:
        baseConfig: default