server:
  port: ${PORT:8080}

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    properties:
      hibernate:
        show_sql: true
        format_sql: true

  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 5000
            readTimeout: 5000

feign:
  client:
    api:
      url: ${API_URL:https://api.twelvedata.com}
      key: ${API_KEY:test-key}

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10000ms
        ignoreExceptions:
          - by.ares.transaction_validation_service.exception.ApiException
  retry:
    configs:
      default:
        maxAttempts: 5
        waitDuration: 500ms
        retryExceptions:
          - by.ares.transaction_validation_service.exception.ApiTimeoutException
  bulkhead:
    configs:
      default:
        maxConcurrentCalls: 5